<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Space background -->
  <rect width="32" height="32" rx="8" fill="#0d0820"/>
  <!-- Planet body -->
  <circle cx="16" cy="16" r="9" fill="#4CAF50"/>
  <!-- Planet shading -->
  <circle cx="16" cy="16" r="9" fill="url(#shade)"/>
  <!-- Orbit ring -->
  <ellipse cx="16" cy="16" rx="13" ry="4.5" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.85"/>
  <!-- Ring hidden behind planet (top arc clipped by planet) -->
  <ellipse cx="16" cy="16" rx="13" ry="4.5" fill="none" stroke="#0d0820" stroke-width="3.5"/>
  <!-- Front ring arc -->
  <path d="M 3 16 A 13 4.5 0 0 0 29 16" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.85"/>
  <!-- Small star dots -->
  <circle cx="4"  cy="5"  r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="28" cy="8"  r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="26" cy="27" r="0.7" fill="#fff" opacity="0.6"/>
  <circle cx="5"  cy="26" r="0.5" fill="#fff" opacity="0.4"/>
  <defs>
    <radialGradient id="shade" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
</svg>
