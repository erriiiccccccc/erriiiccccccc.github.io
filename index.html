<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d0820" />

  <title>Eric's World — Interactive 3D Portfolio</title>
  <meta name="description" content="An interactive 3D portfolio by Eric Ng Min Chern. Walk around a tiny Little Prince–style planet to explore my projects, skills, experience, travels and contact." />
  <meta name="author" content="Eric Ng Min Chern" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://erriiiccccccc.github.io/" />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://erriiiccccccc.github.io/" />
  <meta property="og:title" content="Eric's World — Interactive 3D Portfolio" />
  <meta property="og:description" content="Walk a tiny planet to explore Eric's projects, skills and travels — built with Three.js." />
  <meta property="og:image" content="https://erriiiccccccc.github.io/loading-preview.png" />
  <meta property="og:image:alt" content="Stylised low-poly planet floating in deep purple space" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Eric's World — Interactive 3D Portfolio" />
  <meta name="twitter:description" content="Walk a tiny planet to explore Eric's projects, skills and travels — built with Three.js." />
  <meta name="twitter:image" content="https://erriiiccccccc.github.io/loading-preview.png" />

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/overlay.css" />
</head>
<body>
  <!-- Page heading for screen readers / SEO (the visual "title" is the 3D scene) -->
  <h1 class="sr-only">Eric's World — interactive 3D portfolio of Eric Ng Min Chern</h1>

  <div id="loader" role="status" aria-live="polite" aria-label="Loading Eric's World">
    <!-- Full-bleed preview (cover = same framing as canvas at any aspect ratio) -->
    <div id="ldr-preview-bg" aria-hidden="true"></div>
    <!-- Dark tiles fade out centre-outward to reveal the preview -->
    <div id="ldr-tiles" aria-hidden="true"></div>
    <!-- CRT scanlines -->
    <div id="ldr-scanlines" aria-hidden="true"></div>
    <!-- Pulse rings centred on planet -->
    <div id="ldr-pulse" aria-hidden="true"></div>
    <div id="ldr-pulse2" aria-hidden="true"></div>
    <!-- Top-left system tag -->
    <div id="ldr-tag" aria-hidden="true">◈ &nbsp;WORLD.LOAD</div>
    <!-- Bottom-right progress -->
    <div id="ldr-progress">
      <div id="ldr-label">WARPING SPACETIME</div>
      <div id="ldr-bignum" aria-hidden="true"><span id="ldr-pct">00</span><span class="ldr-sup">%</span></div>
      <div id="ldr-bar-track" aria-hidden="true"><div id="ldr-bar-fill"></div></div>
    </div>
  </div>

  <div id="hud">
    <div id="controls-hint">WASD move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; RMB look around &nbsp;·&nbsp; Scroll zoom</div>
  </div>

  <!-- Detail panel -->
  <div id="detail-panel" class="hidden" role="dialog" aria-modal="false" aria-labelledby="detail-title">
    <div id="detail-header">
      <div id="detail-header-main">
        <div id="detail-icon-badge" aria-hidden="true"><span id="detail-icon"></span></div>
        <div id="detail-titles">
          <div id="detail-island-label"></div>
          <div id="detail-title"></div>
        </div>
      </div>
      <button id="detail-close" type="button" aria-label="Close panel">✕</button>
    </div>
    <div id="detail-content"></div>
  </div>

  <canvas id="canvas" aria-label="Interactive 3D planet — use WASD to walk, press E to explore an island"></canvas>

  <noscript>
    <div class="noscript-fallback">
      <h2>JavaScript is required</h2>
      <p>Eric's World is an interactive 3D experience that needs JavaScript and WebGL to run.</p>
      <p>Please enable JavaScript or visit
        <a href="https://github.com/erriiiccccccc">github.com/erriiiccccccc</a>
        to find out more about Eric.</p>
    </div>
  </noscript>

  <!-- Hard failsafe: if the JS module never loads or crashes, surface the error and let the user retry. -->
  <script>
    (function () {
      var failed = false
      function showFatal(msg) {
        if (failed) return
        failed = true
        var label = document.getElementById('ldr-label')
        if (label) label.textContent = String(msg).slice(0, 140)
        var prog = document.getElementById('ldr-progress')
        if (prog && !document.getElementById('ldr-retry')) {
          var btn = document.createElement('button')
          btn.id = 'ldr-retry'
          btn.type = 'button'
          btn.textContent = 'Reload'
          btn.style.cssText = 'margin-top:14px;padding:6px 14px;font:inherit;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(124,58,237,0.25);border:1px solid rgba(124,58,237,0.7);color:#fff;border-radius:8px;cursor:pointer;'
          btn.onclick = function () { location.reload() }
          prog.appendChild(btn)
        }
      }
      window.addEventListener('error', function (e) {
        showFatal((e.message || 'Unknown error') + ' — ' + ((e.filename || '').split('/').pop() || '') + ':' + (e.lineno || '?'))
      })
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e.reason && (e.reason.message || e.reason)) || 'Module import failed'
        showFatal('Load error: ' + msg)
      })
      // Nuclear fallback: if 12s elapsed and nothing dismissed the loader, fade it out
      // so the user is not stuck behind it forever (covers slow CDNs, partial loads).
      setTimeout(function () {
        var el = document.getElementById('loader')
        if (el && !el.classList.contains('fade-out') && el.style.display !== 'none') {
          el.style.transition = 'opacity 1s'
          el.style.opacity = '0'
          setTimeout(function () { if (el) el.style.display = 'none' }, 1000)
        }
      }, 12000)
    })()
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
